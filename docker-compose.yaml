services:
  presidio-analyzer:
    build: backend/pii-detection/
    container_name: presidio-analyzer
    ports:
      - '5000:3000'

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - '5001:3000'

  redis:
    image: docker.io/library/redis:alpine
    container_name: redis
    ports:
      - '6379:6379'

  mockserver:
    image: docker.io/mockserver/mockserver
    container_name: mockserver
    ports:
      - '1080:1080'
    profiles: [testing]

  mongodb:
    image: docker.io/library/mongo:latest
    container_name: mongodb
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - '27017:27017'

  inference:
    build: inference/
    container_name: inference
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    ports:
      - '5002:8000'

  qdrant:
    image: docker.io/qdrant/qdrant
    container_name: qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
        - "./qdrant_storage:/qdrant/storage:z"

